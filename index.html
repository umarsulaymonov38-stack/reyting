main{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cname{font:700 20px system-ui;border:2px dashed var(--ln);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;width:170px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:var(--ac2);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);color:#fff}
input[type=date],input[type=month]{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink)}
.wrap{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:center}
th{background:var(--ac2);font-size:12px;font-weight:600}
th .ic{display:block;font-size:26px;line-height:1.1}
td.l,th.l{text-align:left}
.nm{width:100%;min-width:150px;font:inherit;border:1px solid transparent;background:transparent;color:var(--ink);padding:6px;border-radius:8px}
.nm:focus,.sc:focus{outline:2px solid var(--ac);background:var(--card)}
.sc{width:54px;font:inherit;text-align:center;padding:6px 2px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink)}
.tot{font-weight:700;color:var(--ac)}
.btn{border:0;background:var(--ac);color:#fff;font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:6px;background:var(--ln);min-width:70px}.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.cl{height:44px;width:44px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--ln)}.ph{display:inline-flex;align-items:center;justify-content:center;font-size:24px}.chip img{height:18px;width:18px;object-fit:contain;vertical-align:-4px;margin-right:5px;border-radius:4px;background:#fff}.code{font:700 20px ui-monospace,monospace;letter-spacing:2px;background:var(--ac2);padding:4px 10px;border-radius:8px}.jc{font:700 22px ui-monospace,monospace;text-transform:uppercase;letter-spacing:3px;width:190px;padding:8px;border-radius:10px;border:2px solid var(--ln);background:var(--card);color:var(--ink);text-align:center}.cn2{font-size:20px}
input,button{touch-action:manipulation}
.sc,.att{width:58px;height:42px;font-size:16px}.att{font-size:20px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.nm,.cname,input[type=date],input[type=month],.jc{font-size:16px}.wrap{-webkit-overflow-scrolling:touch}
td.l:nth-child(2),th.l:nth-child(2){position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--ln)}th.l:nth-child(2){background:var(--ac2)}
@media(max-width:600px){main{padding:10px 8px 30px}.card{padding:10px}header{padding:10px}header img{height:48px}.tab{padding:10px 12px}.chip{padding:9px 13px}th{font-size:11px}th .ic{font-size:22px}.nm{min-width:120px}}
.clk{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}.clk b{display:block;font-size:24px;color:var(--ac);line-height:1.1}.clk span{font-size:12px;color:var(--mut)}
.ab ol{margin:6px 0 0;padding-left:22px}.ab li{padding:3px 0}
.tabs2{display:flex;gap:6px;margin-bottom:10px}.fld{display:block;width:100%;font-size:16px;padding:11px;margin:6px 0;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink)}.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:130px;background:var(--ac2);border-radius:14px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--ac)}
</style></head><body>

 return `<div class="card">${dtBar('<span class="mut">Davomat: ✅ keldi = 1 ball. Qolganlari 0–10 ball.</span>')}<div class="wrap"><table><tr><th>№</th><th class="l">F.I.Sh</th>${th()}<th>Jami<br>/${MAXD}</th></tr>${S.st.map((s,i)=>{const r=S.sc[s.id]||{};return`<tr><td>${i+1}</td><td class="l"><input class="nm" data-n="${s.id}" value="${esc(s.full_name)}" placeholder="Ism familiya"></td>${CR.map(x=>x.c=='att'?`<td><button class="att" data-i="${s.id}">${AT[String(r.att??'')]}</button></td>`:`<td><input class="sc" type="number" min="0" max="${x.m}" inputmode="numeric" data-i="${s.id}" data-k="${x.c}" value="${r[x.c]??''}"></td>`).join('')}<td class="tot" id="t${s.id}">${sum(r)}</td></tr>`}).join('')}</table></div></div>`}
async function rateView(){await loadCls();const rows=S.st.filter(s=>s.full_name.trim()).map(s=>({n:s.full_name,t:sum(S.sc[s.id])})).sort((a,b)=>b.t-a.t);
 return `<div class="card">${dtBar()}${rows.length?`<div class="wrap"><table><tr><th>O'rin</th><th class="l">F.I.Sh</th><th>Ball</th><th>Foiz</th><th></th></tr>${rows.map((r,j)=>`<tr><td>${MD[j]||j+1}</td><td class="l">${esc(r.n)}</td><td class="tot">${r.t}/${MAXD}</td><td>${Math.round(r.t/MAXD*100)}%</td><td><div class="bar"><i style="width:${Math.min(100,r.t/MAXD*100)}%"></i></div></td></tr>`).join('')}</table></div>`:'<p class="mut">Avval «Baholash» bo\'limida ismlarni yozing.</p>'}</div>`}
async function clsView(){const r=await q(sb.rpc('class_ranking',{p_day:S.date}));
 return `<div class="card">${dtBar()}<div class="wrap"><table><tr><th>O'rin</th><th class="l">Sinf</th><th>Jami ball</th><th>O'rtacha foiz</th><th></th></tr>${r.map((x,j)=>`<tr><td>${x.has?(MD[j]||j+1):'—'}</td><td class="l">${x.logo?`<img class="cl" style="height:28px;width:28px;vertical-align:middle;margin-right:6px" src="${x.logo}">`:''}${esc(x.name)}</td><td class="tot">${x.has?x.total:'—'}</td><td class="tot">${x.has?x.pct+'%':'baholanmagan'}</td><td><div class="bar"><i style="width:${x.has?Math.min(100,x.pct):0}%"></i></div></td></tr>`).join('')}</table></div><p class="mut">Foiz = sinfning jami bali ÷ (o'quvchilar soni × ${MAXD}).</p></div>`}
async function absView(){const t=nowT();let h=`<div class="card">${dtBar("<span class=\"mut\">Kelmaganlar ro'yxati har kuni soat 10:00 da shakllanadi.</span>")}`;
 if(S.date==t.d&&t.h<10&&!S.peek)return h+`<p>⏳ Bugungi ro'yxat <b>10:00</b> da shakllanadi. Qolgan vaqt: <b id="cd"></b></p><button class="tab" id="pk">👁️ Hozirgi holatni ko'rish</button></div>`;
 const[rows,sts]=await Promise.all([q(sb.from('daily_scores').select('student_id,att').eq('day',S.date)),q(sb.from('students').select('id,class_id,slot,full_name'))]);
 const a={};rows.forEach(r=>{if(r.att!=null)a[r.student_id]=r.att});let n=0,no=[],cards='';
 CL.forEach(c=>{const ss=sts.filter(s=>s.class_id==c.id).sort((x,y)=>x.slot-y.slot);if(!ss.some(s=>s.id in a)){no.push(c.name);return}
  const ab=ss.filter(s=>s.full_name.trim()&&a[s.id]===0).map(s=>s.full_name);if(!ab.length)return;n+=ab.length;
  cards+=`<div class="card ab"><div class="top">${c.logo?`<img class="cl" src="${c.logo}">`:'<span class="cl ph">🏫</span>'}<div><b style="font-size:18px">${esc(c.name)}</b><br><span class="mut">👨‍🏫 ${esc(c.teacher_name)||"O'qituvchi kiritilmagan"}</span></div><span class="code" style="margin-left:auto">${ab.length}</span></div><ol>${ab.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`});
 return h+`<p>Jami kelmaganlar: <b>${n}</b></p>${no.length?`<p class="mut">Davomat kiritilmagan sinflar: ${no.map(esc).join(', ')}</p>`:''}</div>`+cards}
async function setView(){const c=CL.find(x=>x.id==S.cls),cc=await q(sb.from('class_codes').select('code').eq('class_id',S.cls).maybeSingle());
 const sp=await q(sb.from('student_private').select('student_id,code,parent_phone,claimed_by,students!inner(full_name,slot,class_id)').eq('students.class_id',S.cls));sp.sort((a,b)=>a.students.slot-b.students.slot);
 return `<div class="card"><b>Sinf sozlamalari</b><div class="top"><input class="cname" id="cn" value="${esc(c.name)}" maxlength="24"><input class="cname" id="tn" style="width:min(100%,280px)" placeholder="O'qituvchi F.I.Sh" value="${esc(c.teacher_name)}"><button class="tab" id="lgb">🖼️ Logotip</button><input type="file" id="lg" accept="image/*" hidden></div><div class="top"><span class="mut">O'qituvchi kodi:</span><span class="code">${cc?esc(cc.code):'—'}</span><button class="tab" id="gc">🔑 Yangi kod</button></div></div>
 <div class="card"><b>Ota-onalar: telefon va kirish kodlari</b><p class="mut">Har bir ota-onaga uning o'quvchi kodini shaxsan bering.</p><div class="wrap"><table><tr><th>№</th><th class="l">O'quvchi</th><th>Ota-ona telefoni</th><th>Kod</th><th>Holat</th></tr>${sp.map(r=>`<tr><td>${r.students.slot}</td><td class="l">${esc(r.students.full_name)||'—'}</td><td><input class="nm" style="min-width:140px" data-p="${r.student_id}" value="${esc(r.parent_phone)}" placeholder="+998..."></td><td><span class="code" style="font-size:15px">${r.code}</span></td><td>${r.claimed_by?'✅ ulangan':'—'}</td></tr>`).join('')}</table></div></div>`}
async function parentView(){const mm=S.month.split('-'),a=S.month+'-01',b=S.month+'-'+String(new Date(Date.UTC(+mm[0],+mm[1],0)).getUTCDate()).padStart(2,'0');
 const[me,rows,rk]=await Promise.all([q(sb.from('students').select('full_name,class_id').eq('id',ME.student_id).single()),q(sb.from('daily_scores').select('*').gte('day',a).lte('day',b).order('day')),q(sb.rpc('my_task_rank',{p_from:a,p_to:b}))]);const r=rk&&rk[0];
 return `<div class="card"><div class="top"><b class="cn2">${esc(me.full_name)}</b><span class="mut">${esc(cname(me.class_id))}</span></div><div class="top"><b>Oy:</b><input type="month" id="mo" value="${S.month}"></div><div class="kpi"><div><b>${r?r.total:0}</b>jami ball</div><div><b>${r?r.class_rank+'/'+r.class_size:'—'}</b>🏫 sinfda o'rin</div><div><b>${r?r.school_rank+'/'+r.school_size:'—'}</b>🏛️ maktabda o'rin</div></div><p class="mut">Kunlik vazifalar bo'yicha reyting. Fan baholari, to'lov va taomnoma tez orada qo'shiladi.</p></div>
 <div class="card"><b>Kunlik ballar</b><div class="wrap"><table><tr><th>Sana</th>${th()}<th>Jami</th></tr>${rows.length?rows.map(x=>`<tr><td>${x.day.slice(8)}.${x.day.slice(5,7)}</td>${CR.map(c=>`<td>${c.c=='att'?(AT[String(x.att??'')]):(x[c.c]??'—')}</td>`).join('')}<td class="tot">${sum(x)}</td></tr>`).join(''):'<tr><td colspan="8" class="mut">Bu oy ma\'lumot yo\'q</td></tr>'}</table></div></div>`}
function rs(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,110/Math.max(im.width,im.height)),v=document.createElement('canvas');v.width=Math.round(im.width*k);v.height=Math.round(im.height*k);const x=v.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,v.width,v.height);x.drawImage(im,0,0,v.width,v.height);cb(v.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)}
const upd=async(tb,v,k,id)=>{const{error}=await sb.from(tb).update(v).eq(k,id);if(error)flash(error.message)};
async function signOut(){await sb.auth.signOut();ME=null;flash('');loginView()}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-c],[data-t],[data-lt],.att,#net,#out,#pk,#gc,#lgb,#tgo,#treg,#pgo');if(!t)return;
 if(t.dataset.lt!=null){S.lt=+t.dataset.lt;loginView()}else if(t.dataset.c){S.cls=+t.dataset.c;render()}else if(t.dataset.t!=null){S.tab=+t.dataset.t;render()}
 else if(t.id=='out')signOut();else if(t.id=='pk'){S.peek=true;render()}else if(t.id=='lgb')$('lg').click();
 else if(t.id=='net'){try{const r=await fetch('https://yzaxyjypswpjcebmjsnj.supabase.co/auth/v1/health',{headers:{apikey:'sb_publishable_TjlRpWYw6ITgx_ihiGwfEA_ZFAFrp4v'}});flash('Ulanish bor: '+r.status+' '+(await r.text()).slice(0,60))}catch(e){flash('Ulanish yo\'q: '+e.message)}}
 else if(t.id=='treg'){S.reg=!S.reg;loginView()}
 else if(t.id=='gc'){const a=new Uint32Array(6);crypto.getRandomValues(a);const code=[...a].map(v=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[v%31]).join('');const{error}=await sb.from('class_codes').upsert({class_id:S.cls,code});if(error)flash(error.message);else render()}
 else if(t.classList.contains('att')){const id=t.dataset.i,r=S.sc[id]||(S.sc[id]={student_id:id,day:S.date}),n=r.att==null?1:r.att==1?0:null;r.att=n;t.textContent=AT[String(n??'')];$('t'+id).textContent=sum(r);const{error}=await sb.from('daily_scores').upsert({student_id:id,day:S.date,att:n},{onConflict:'student_id,day'});if(error)flash(error.message)}
 else if(t.id=='tgo'){const email=$('em').value.trim(),password=$('pw').value;if(!email||password.length<6){flash("Email va kamida 6 belgili parol kiriting");return}
  if(!S.reg){const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){flash(errTxt(error));return}await loadMe(data.user.id);return}
  const{data,error}=await sb.auth.signUp({email,password});if(error){flash(error.message);return}if(!data.session){flash("Ro'yxatdan o'tib bo'lmadi: admin Supabase'da «Confirm email» ni o'chirishi kerak");return}
  const{error:e2}=await sb.rpc('join_class',{p_code:$('jc').value,p_name:$('fn').value});if(e2){flash(e2.message);return}await loadMe(data.user.id)}
 else if(t.id=='pgo'){const code=$('pc').value.trim().toUpperCase(),password=$('pp').value;if(!code||password.length<6){flash("Kod va kamida 6 belgili parol kiriting");return}
  const{data:st}=await sb.rpc('student_code_status',{p_code:code});if(st!='free'&&st!='taken'){flash("Kod noto'g'ri");return}
  const email=code.toLowerCase()+'@ota.yuksalish.app';let uid;
  if(st=='free'){const{data,error}=await sb.auth.signUp({email,password});if(error){flash(error.message);return}if(!data.session){flash("Admin Supabase'da «Confirm email» ni o'chirishi kerak");return}uid=data.user.id;const{error:e2}=await sb.rpc('claim_student',{p_code:code});if(e2){flash(e2.message);return}}
  else{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){flash(errTxt(error));return}uid=data.user.id}
  await loadMe(uid)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='sp')['pw','pp'].forEach(i=>{const x=$(i);if(x)x.type=t.checked?'text':'password'});
 if(t.id=='dt'&&t.value){S.date=t.value;S.month=t.value.slice(0,7);render()}
 if(t.id=='mo'&&t.value){S.month=t.value;render()}
 if(t.id=='lg'&&t.files[0])rs(t.files[0],async u=>{await upd('classes',{logo:u},'id',S.cls);CL.find(c=>c.id==S.cls).logo=u;render()})});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(t.id=='cn'||t.id=='tn'){const f=t.id=='cn'?'name':'teacher_name';CL.find(c=>c.id==S.cls)[f]=t.value;dbn(t.id,()=>upd('classes',{[f]:t.value},'id',S.cls));if(f=='name')chips();return}
 if(d.n){dbn('n'+d.n,()=>upd('students',{full_name:t.value},'id',d.n));return}
 if(d.p){dbn('p'+d.p,()=>upd('student_private',{parent_phone:t.value},'student_id',d.p));return}
 if(d.i&&d.k){let v=t.value,m=CR.find(x=>x.c==d.k).m;if(v!==''){v=Math.max(0,Math.min(m,Math.round(+v)));if(String(v)!==t.value)t.value=v}const val=v===''?null:+v,r=S.sc[d.i]||(S.sc[d.i]={});r[d.k]=val;$('t'+d.i).textContent=sum(r);
  dbn('s'+d.i+d.k,async()=>{const{error}=await sb.from('daily_scores').upsert({student_id:d.i,day:S.date,[d.k]:val},{onConflict:'student_id,day'});if(error)flash(error.message)},350)}});
let lastD=today;
function tick(){const t=nowT();$('clk').innerHTML=`<b>${t.hms}</b><span>${t.wd}, ${t.lbl} · Toshkent vaqti</span>`;
 if(t.d!==lastD){if(S.date==lastD){S.date=t.d;S.month=t.d.slice(0,7)}lastD=t.d;if(ME)render()}
 const cd=$('cd');if(cd){const r=36000-(t.h*3600+t.m*60+t.s);if(r<=0)render();else cd.textContent=[r/3600|0,(r%3600)/60|0,r%60].map(v=>String(v).padStart(2,'0')).join(':')}}
setInterval(tick,1000);tick();boot();
</script></body></html>
